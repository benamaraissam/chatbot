name: Publish Angular → npm

on:
  push:
    tags:
      - "angular-v*"
  release:
    types: [published]

jobs:
  # Gate that skips the `push: tags` event when a Release also exists for the
  # same tag — the `release: published` run will handle the publish instead.
  decide:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Decide
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "Triggered by release event — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          # Only publish from this workflow if the tag matches angular-v*.
          if [[ "$TAG" != angular-v* ]]; then
            echo "Tag '$TAG' is not an angular-v* tag — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release exists for $TAG — release event will publish. Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for $TAG — proceeding from push: tags."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: decide
    if: needs.decide.outputs.proceed == 'true'
    name: Build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbot-angular-library

    permissions:
      contents: read
      id-token: write  # required for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          RAW="${{ github.event.release.tag_name || github.ref_name }}"
          # Strip optional angular-v / v / angular- prefix.
          VERSION="${RAW#angular-v}"
          VERSION="${VERSION#angular-}"
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Could not derive version from '$RAW'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (from '$RAW')"

      - name: Sync version into library package.json
        working-directory: chatbot-angular-library/projects/chatbot-angular
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Rebuild after version sync
        run: npm run build

      - name: Publish
        working-directory: chatbot-angular-library/projects/chatbot-angular/dist
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
