name: Publish Python → PyPI

on:
  push:
    tags:
      - "python-v*"
  release:
    types: [published]

jobs:
  # Gate that skips the `push: tags` event when a Release also exists for the
  # same tag — the `release: published` run will handle the publish instead.
  decide:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Decide
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "Triggered by release event — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release exists for $TAG — release event will publish. Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for $TAG — proceeding from push: tags."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: decide
    if: needs.decide.outputs.proceed == 'true'
    name: Build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbot-python-library

    permissions:
      contents: read
      id-token: write  # required for PyPI trusted publishing

    environment:
      name: pypi
      url: https://pypi.org/project/chatbot/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src/

      - name: Tests
        run: uv run pytest

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # Prefer the release event's tag, fall back to the pushed tag ref.
          RAW="${{ github.event.release.tag_name || github.ref_name }}"
          # Strip optional python-v / v / python- prefix so 'python-v0.1.1',
          # 'v0.1.1', '0.1.1' all yield 0.1.1.
          VERSION="${RAW#python-v}"
          VERSION="${VERSION#python-}"
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Could not derive version from '$RAW'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (from '$RAW')"

      - name: Sync version into pyproject.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml

      - name: Build
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: chatbot-python-library/dist/
