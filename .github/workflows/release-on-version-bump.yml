name: Release on version bump

# Fires automatically when CI succeeds on main. Compares the version fields in
# chatbot-python-library/pyproject.toml and chatbot-react-library/package.json
# against the previous commit. If either changed, creates and pushes the
# matching tag (python-v<version> or react-v<version>), which triggers the
# existing publish-pypi.yml / publish-npm.yml workflows.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write  # required to push tags back to the repo

jobs:
  tag-if-bumped:
    name: Tag on version bump
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v4
        with:
          # Need at least 2 commits so HEAD~1 exists for diffing.
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect Python version bump
        id: py
        run: |
          set -euo pipefail
          FILE="chatbot-python-library/pyproject.toml"
          NEW=$(grep -E '^version *= *"' "$FILE" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          OLD=$(git show HEAD~1:"$FILE" 2>/dev/null | grep -E '^version *= *"' | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "")
          echo "old=$OLD"
          echo "new=$NEW"
          if [[ -n "$NEW" && "$NEW" != "$OLD" ]]; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "version=$NEW"  >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect React version bump
        id: js
        run: |
          set -euo pipefail
          FILE="chatbot-react-library/package.json"
          NEW=$(node -p "require('./$FILE').version")
          OLD=$(git show HEAD~1:"$FILE" 2>/dev/null | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{console.log(JSON.parse(s).version)}catch(e){console.log('')}})" || echo "")
          echo "old=$OLD"
          echo "new=$NEW"
          if [[ -n "$NEW" && "$NEW" != "$OLD" ]]; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "version=$NEW"  >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.py.outputs.changed == 'true' || steps.js.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag Python release
        if: steps.py.outputs.changed == 'true'
        run: |
          TAG="python-v${{ steps.py.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            git tag -a "$TAG" -m "Release Python $TAG"
            git push origin "$TAG"
            echo "Pushed $TAG — publish-pypi.yml will run."
          fi

      - name: Tag React release
        if: steps.js.outputs.changed == 'true'
        run: |
          TAG="react-v${{ steps.js.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            git tag -a "$TAG" -m "Release React $TAG"
            git push origin "$TAG"
            echo "Pushed $TAG — publish-npm.yml will run."
          fi

      - name: Summary
        run: |
          {
            echo "### Release tagger result"
            echo ""
            echo "| Package | Old | New | Tagged |"
            echo "|---------|-----|-----|--------|"
            echo "| Python  | ${{ steps.py.outputs.old || '—' }} | ${{ steps.py.outputs.new || '—' }} | ${{ steps.py.outputs.changed }} |"
            echo "| React   | ${{ steps.js.outputs.old || '—' }} | ${{ steps.js.outputs.new || '—' }} | ${{ steps.js.outputs.changed }} |"
          } >> "$GITHUB_STEP_SUMMARY"
