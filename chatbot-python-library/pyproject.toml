[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbot"
version = "0.1.0"
description = "Framework-agnostic Python chatbot backend — multi-LLM, MCP-ready, tools API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai>=0.0.14",
  "httpx>=0.27",
  "tenacity>=8.0",
  "mcp>=1.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "sse-starlette>=2.0"]
flask = ["flask>=2.3"]
django = ["django>=4.2", "channels>=4.0"]
starlette = ["starlette>=0.30", "sse-starlette>=2.0"]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
openapi = ["openapi-pydantic>=0.4"]
litellm = ["litellm>=1.0"]
server = ["chatbot[fastapi]", "uvicorn[standard]>=0.27", "pyyaml>=6.0", "python-dotenv>=1.0"]
all = [
  "chatbot[fastapi,flask,django,starlette,postgres,redis,openapi,litellm,server]",
]

[project.scripts]
chatbot = "chatbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
  "python-dotenv>=1.0",
]
