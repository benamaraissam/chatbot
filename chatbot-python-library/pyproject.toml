[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbot"
version = "0.1.0"
description = "Framework-agnostic Python chatbot backend — multi-LLM, MCP-ready, tools API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai>=0.0.14",
  "httpx>=0.27",
  "tenacity>=8.0",
  "mcp>=1.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "sse-starlette>=2.0"]
flask = ["flask>=2.3"]
django = ["django>=4.2", "channels>=4.0"]
starlette = ["starlette>=0.30", "sse-starlette>=2.0"]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
openapi = ["openapi-pydantic>=0.4"]
litellm = ["litellm>=1.0"]
server = ["chatbot[fastapi]", "uvicorn[standard]>=0.27", "pyyaml>=6.0", "python-dotenv>=1.0"]
all = [
  "chatbot[fastapi,flask,django,starlette,postgres,redis,openapi,litellm,server]",
]

[project.scripts]
chatbot = "chatbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/chatbot"]
branch = true
omit = [
  "*/__init__.py",
  # Optional integrations / providers that require external services not
  # available in CI (Django+Channels, Postgres, external APIs for builtins).
  # These are tested separately under their respective service environments.
  "src/chatbot/integrations/django.py",
  "src/chatbot/storage/postgres.py",
  "src/chatbot/tools/builtin/code_interpreter.py",
  "src/chatbot/tools/builtin/generate_file.py",
  "src/chatbot/tools/builtin/web_search.py",
  # CLI entrypoint — tested via subprocess in a separate suite.
  "src/chatbot/cli.py",
  # Server bootstrap (uvicorn) — exercised by integration tests, not unit.
  "src/chatbot/server/app.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.json]
output = "coverage/coverage.json"
pretty_print = true

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "coverage[toml]>=7.6",
  "httpx>=0.27",
  "ruff>=0.8",
  "python-dotenv>=1.0",
]
